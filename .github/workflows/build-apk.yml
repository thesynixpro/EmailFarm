name: Build and publish debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-release
  cancel-in-progress: false

env:
  GRADLE_VERSION: '9.6.0'
  AGP_VERSION: '9.4.0'
  APK_PATH: 'app/build/outputs/apk/debug/app-debug.apk'
  ARTIFACT_NAME: 'app-debug-apk'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify project Android Gradle Plugin version
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle.kts || {
            echo 'ERROR: Root build.gradle.kts is missing.' >&2
            exit 1
          }
          grep -Fq 'id("com.android.application") version "9.4.0" apply false' build.gradle.kts || {
            echo 'ERROR: AGP 9.4.0 was not confirmed from build.gradle.kts.' >&2
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify active Java version
        shell: bash
        run: |
          set -euo pipefail
          java -version
          JAVA_MAJOR="$(java -version 2>&1 | awk -F'[".]' '/version/ {print $2; exit}')"
          test "$JAVA_MAJOR" = '17' || {
            echo "ERROR: Java 17 is required; active Java major version is $JAVA_MAJOR." >&2
            exit 1
          }

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail
          test "$(gradle --version | awk '/^Gradle / {print $2; exit}')" = "$GRADLE_VERSION" || {
            echo "ERROR: Gradle $GRADLE_VERSION is required." >&2
            exit 1
          }
          test ! -x ./gradlew || {
            echo 'INFO: Repository Gradle wrapper exists but will not be used.'
          }

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          rm -f "$DEBUG_KEYSTORE"
          keytool -genkeypair \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -noprompt
          test -f "$DEBUG_KEYSTORE"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          test "$AGP_VERSION" = '9.4.0'
          test "$GRADLE_VERSION" = '9.6.0'
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -f "$APK_PATH"
          file "$APK_PATH"
          unzip -tq "$APK_PATH" >/dev/null

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release asset
        id: release_asset
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          ASSET_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"
          cp -- "$APK_PATH" "$ASSET_PATH"
          test -f "$ASSET_PATH"
          case "$ASSET_NAME" in
            *.apk) ;;
            *) echo 'ERROR: release asset is not an APK.' >&2; exit 1 ;;
          esac
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          ASSET_PATH: ${{ steps.release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          Source commit SHA: ${GITHUB_SHA}
          The APK is intended for testing.
          The APK is not a Play Store production release.
          The APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH#$ASSET_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          ASSET_NAME: ${{ steps.release_asset.outputs.asset_name }}
        shell: bash
        run: |
          echo '### APK release result' >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ steps.publish_release.outcome }}" == 'success' ]]; then
            if RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json tagName,name,url,assets 2>&1)"; then
              TAG_NAME="$(jq -r '.tagName' <<<"$RELEASE_JSON")"
              TITLE="$(jq -r '.name' <<<"$RELEASE_JSON")"
              URL="$(jq -r '.url' <<<"$RELEASE_JSON")"
              ASSET_FOUND="$(jq -r --arg name "$ASSET_NAME" '[.assets[].name | select(. == $name)] | length' <<<"$RELEASE_JSON")"

              if [[ "$TAG_NAME" == "$RELEASE_TAG" && "$ASSET_FOUND" == '1' ]]; then
                echo "Release tag: $TAG_NAME"
                echo "Release title: $TITLE"
                echo "Direct GitHub Release page URL: $URL"
                echo "Exact APK asset filename: $ASSET_NAME"
                echo 'The APK can be downloaded from the release Assets section.'
                echo 'The normal Actions artifact (app-debug-apk) is also available as a backup.'

                {
                  echo '**Release publishing succeeded.**'
                  echo
                  echo "- Release tag: \`$TAG_NAME\`"
                  echo "- Release title: \`$TITLE\`"
                  echo "- Release page: $URL"
                  echo "- APK asset: \`$ASSET_NAME\`"
                  echo
                  echo 'The APK can be downloaded from the release Assets section.'
                  echo 'The normal Actions artifact **app-debug-apk** is also available as a backup.'
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo 'WARNING: GitHub Release command returned success, but release verification failed.' >&2
                echo 'The APK build succeeded and the Actions artifact named app-debug-apk remains available.'
                {
                  echo '**WARNING: Release verification failed after the release command returned success.**'
                  echo
                  echo 'The APK build succeeded.'
                  echo 'The Actions artifact **app-debug-apk** remains available as a backup.'
                  echo 'No release URL is reported because the release could not be verified.'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo 'WARNING: GitHub Release was reported successful, but gh release view could not confirm it.' >&2
              echo 'The APK build succeeded and the Actions artifact named app-debug-apk remains available.'
              {
                echo '**WARNING: GitHub Release verification failed.**'
                echo
                echo 'The APK build succeeded.'
                echo 'The Actions artifact **app-debug-apk** remains available as a backup.'
                echo 'No release URL is reported because the release could not be confirmed.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'WARNING: GitHub Release publishing failed.' >&2
            echo 'The APK build succeeded and the Actions artifact named app-debug-apk remains available.'
            echo 'No release URL is reported because release publishing did not succeed.'
            {
              echo '**WARNING: GitHub Release publishing failed.**'
              echo
              echo 'The APK build succeeded.'
              echo 'The Actions artifact **app-debug-apk** remains available as a backup.'
              echo 'No release URL is reported because the release was not confirmed.'
              echo 'The workflow does not fail the completed APK build solely because release publishing failed.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Final cleanup check
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -f "$HOME/.android/debug.keystore" || rm -f "$HOME/.android/debug.keystore"
          unset DEBUG_KEYSTORE GH_TOKEN || true
