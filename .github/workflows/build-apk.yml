name: Build and publish debug APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-apk-release
  cancel-in-progress: false

env:
  GRADLE_VERSION: '9.6.0'
  AGP_VERSION: '9.4.0'
  ARTIFACT_NAME: 'app-debug-apk'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Prefer a normal root Android project.
          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]] &&
             [[ -f "build.gradle.kts" || -f "build.gradle" ]]; then
            PROJECT_DIR="."
          fi

          # Also support a single nested project folder such as ./dotmail/.
          if [[ -z "$PROJECT_DIR" ]]; then
            for dir in */; do
              [[ -d "$dir" ]] || continue
              if [[ -f "${dir}settings.gradle.kts" || -f "${dir}settings.gradle" ]] &&
                 [[ -f "${dir}build.gradle.kts" || -f "${dir}build.gradle" ]] &&
                 [[ -d "${dir}app" ]]; then
                PROJECT_DIR="${dir%/}"
                break
              fi
            done
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Could not find an Android Gradle project." >&2
            echo "Expected settings.gradle(.kts), build.gradle(.kts), and an app/ module." >&2
            exit 1
          fi

          echo "Android project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android project configuration
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle.kts || test -f settings.gradle || {
            echo "ERROR: settings.gradle.kts or settings.gradle is missing." >&2
            exit 1
          }

          test -f build.gradle.kts || test -f build.gradle || {
            echo "ERROR: Root build.gradle.kts or build.gradle is missing." >&2
            exit 1
          }

          test -d app || {
            echo "ERROR: app/ module is missing." >&2
            exit 1
          }

          ROOT_BUILD=""
          if [[ -f build.gradle.kts ]]; then
            ROOT_BUILD="build.gradle.kts"
          else
            ROOT_BUILD="build.gradle"
          fi

          grep -Fq 'id("com.android.application") version "9.4.0" apply false' "$ROOT_BUILD" || {
            echo "ERROR: AGP 9.4.0 was not confirmed in $ROOT_BUILD." >&2
            exit 1
          }

          if grep -Rqs 'org.jetbrains.kotlin.android' app "$ROOT_BUILD" settings.gradle.kts settings.gradle 2>/dev/null; then
            echo "ERROR: org.jetbrains.kotlin.android must not be applied with AGP 9 built-in Kotlin." >&2
            exit 1
          fi

          echo "Android Gradle project configuration looks valid."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify active Java version
        shell: bash
        run: |
          set -euo pipefail
          java -version
          JAVA_MAJOR="$(java -version 2>&1 | awk -F'[".]' '/version/ {print $2; exit}')"
          test "$JAVA_MAJOR" = '17' || {
            echo "ERROR: Java 17 is required; active Java major version is $JAVA_MAJOR." >&2
            exit 1
          }

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_GRADLE="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          test "$ACTIVE_GRADLE" = "$GRADLE_VERSION" || {
            echo "ERROR: Gradle $GRADLE_VERSION is required; found $ACTIVE_GRADLE." >&2
            exit 1
          }
          echo "Using Gradle $ACTIVE_GRADLE."

      - name: Configure debug signing key
        shell: bash
        env:
          DOTMAIL_DEBUG_KEYSTORE_BASE64: ${{ secrets.DOTMAIL_DEBUG_KEYSTORE_BASE64 }}
          DOTMAIL_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DOTMAIL_DEBUG_KEYSTORE_PASSWORD }}
          DOTMAIL_DEBUG_KEY_ALIAS: ${{ secrets.DOTMAIL_DEBUG_KEY_ALIAS }}
          DOTMAIL_DEBUG_KEY_PASSWORD: ${{ secrets.DOTMAIL_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          rm -f "$DEBUG_KEYSTORE"

          if [[ -n "${DOTMAIL_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            echo "$DOTMAIL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$DEBUG_KEYSTORE"
            test -s "$DEBUG_KEYSTORE"
            echo 'Using the stable debug keystore supplied through GitHub Secrets.'
          else
            keytool -genkeypair \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -noprompt
            echo 'No stable signing key secret was configured; generated a temporary debug keystore.'
          fi

          test -f "$DEBUG_KEYSTORE"
          echo "DOTMAIL_DEBUG_KEYSTORE_PATH=$DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          if [[ -n "${DOTMAIL_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            echo "DOTMAIL_DEBUG_KEYSTORE_PASSWORD=$DOTMAIL_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DOTMAIL_DEBUG_KEY_ALIAS=$DOTMAIL_DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DOTMAIL_DEBUG_KEY_PASSWORD=$DOTMAIL_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo 'DOTMAIL_DEBUG_KEYSTORE_PASSWORD=android' >> "$GITHUB_ENV"
            echo 'DOTMAIL_DEBUG_KEY_ALIAS=androiddebugkey' >> "$GITHUB_ENV"
            echo 'DOTMAIL_DEBUG_KEY_PASSWORD=android' >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test "$AGP_VERSION" = '9.4.0'
          test "$GRADLE_VERSION" = '9.6.0'

          gradle :app:assembleDebug --stacktrace --no-daemon

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH" || {
            echo "ERROR: Expected APK was not produced at $APK_PATH." >&2
            exit 1
          }

          file "$APK_PATH"
          unzip -tq "$APK_PATH" >/dev/null
          echo "APK build and archive validation succeeded."

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release asset
        id: release_asset
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"

          ASSET_NAME="dotmail-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

          cp -- "$APK_PATH" "$ASSET_PATH"
          test -f "$ASSET_PATH"

          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: dotmail-debug-${{ github.run_number }}-${{ github.run_attempt }}
          ASSET_PATH: ${{ steps.release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          DotMail debug APK generated by GitHub Actions.

          Build run: ${GITHUB_RUN_NUMBER}
          Build attempt: ${GITHUB_RUN_ATTEMPT}
          Source commit: ${GITHUB_SHA}

          This APK is for testing.
          It is signed with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH#$ASSET_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: dotmail-debug-${{ github.run_number }}-${{ github.run_attempt }}
          ASSET_NAME: ${{ steps.release_asset.outputs.asset_name }}
        shell: bash
        run: |
          echo '### DotMail APK build/release result' >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ steps.publish_release.outcome }}" == "success" ]]; then
            if RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json tagName,name,url,assets 2>&1)"; then
              TAG_NAME="$(jq -r '.tagName' <<<"$RELEASE_JSON")"
              TITLE="$(jq -r '.name' <<<"$RELEASE_JSON")"
              URL="$(jq -r '.url' <<<"$RELEASE_JSON")"
              ASSET_FOUND="$(jq -r --arg name "$ASSET_NAME" '[.assets[].name | select(. == $name)] | length' <<<"$RELEASE_JSON")"

              if [[ "$TAG_NAME" == "$RELEASE_TAG" && "$ASSET_FOUND" == "1" ]]; then
                echo "Release tag: $TAG_NAME"
                echo "Release title: $TITLE"
                echo "Release page: $URL"
                echo "APK asset: $ASSET_NAME"

                {
                  echo '**APK build succeeded and GitHub Release was verified.**'
                  echo
                  echo "- Release tag: \`$TAG_NAME\`"
                  echo "- Release title: \`$TITLE\`"
                  echo "- Release page: $URL"
                  echo "- APK asset: \`$ASSET_NAME\`"
                  echo "- Actions artifact: \`app-debug-apk\`"
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "WARNING: Release verification failed." >&2
                {
                  echo '**APK build succeeded, but Release verification failed.**'
                  echo
                  echo 'The Actions artifact **app-debug-apk** is still available.'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "WARNING: Could not verify GitHub Release." >&2
              {
                echo '**APK build succeeded, but GitHub Release could not be verified.**'
                echo
                echo 'The Actions artifact **app-debug-apk** is still available.'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "WARNING: GitHub Release publishing failed." >&2
            {
              echo '**APK build succeeded, but GitHub Release publishing failed.**'
              echo
              echo 'The Actions artifact **app-debug-apk** is still available.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Final cleanup check
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$HOME/.android/debug.keystore"
